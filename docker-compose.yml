# ============================================================
# Ad Performance Dashboard — Docker Compose
# ============================================================
# Services:
#   1. dagster-webserver — Dagster UI on port 3000
#   2. dagster-daemon    — Executes schedules & retries in background
#   3. dashboard        — Streamlit dashboard on port 8501
#
# Quick start:
#   docker-compose up --build
# ============================================================

services:
  # ---- Dagster UI & Orchestration ----
  dagster-webserver:
    build: .
    container_name: ad-dagster-webserver
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ./dbt_project:/app/dbt_project
      - ./dagster_project:/app/dagster_project
    restart: unless-stopped

  dagster-daemon:
    build: .
    container_name: ad-dagster-daemon
    command: dagster-daemon run -w workspace.yaml
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ./dbt_project:/app/dbt_project
      - ./dagster_project:/app/dagster_project
    restart: unless-stopped

  # ---- Streamlit Dashboard ----
  dashboard:
    build: .
    container_name: ad-dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ./dbt_project:/app/dbt_project
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
