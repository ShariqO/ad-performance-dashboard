ad_performance:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH_ABSOLUTE') }}"
      role: ACCOUNTADMIN
      database: AD_PERFORMANCE
      warehouse: AD_PIPELINE_WH
      schema: RAW
      threads: 4
